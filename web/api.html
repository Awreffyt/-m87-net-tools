<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#070a0f" />
<title>M87 API 参考</title>
<link rel="stylesheet" href="/static/styles.css?v=1.2" />
<style>
  body { display: block; overflow: auto; }
  .api-page { max-width: 980px; margin: 0 auto; padding: 32px 22px 80px; }
  .api-head { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .api-head .mark {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    display: grid; place-items: center; background: #0d1622; border: 1px solid var(--line-2);
  }
  .api-head h1 { font-size: 22px; font-weight: 700; }
  .api-head p { margin-top: 3px; color: var(--muted); font-size: 12.5px; }
  .api-intro {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 18px 0 20px; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    color: var(--muted); font-size: 12px; line-height: 1.7;
  }
  .api-intro code { color: #bae6fd; font-family: var(--mono); font-size: 11.5px; }
  .api-search { margin-bottom: 18px; }
  .api-search .input-shell { height: 42px; }
  .api-group { margin-bottom: 22px; }
  .api-group h2 {
    font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
  }
  .api-item {
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
    margin-bottom: 8px; overflow: hidden;
  }
  .api-item summary {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; cursor: pointer; list-style: none;
  }
  .api-item summary::-webkit-details-marker { display: none; }
  .api-item summary:hover { background: var(--panel-2); }
  .method {
    flex-shrink: 0; min-width: 54px; text-align: center;
    padding: 3px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 700;
    font-family: var(--mono); letter-spacing: .3px;
  }
  .method.get { color: #6ee7b7; background: rgba(52, 211, 153, .12); }
  .method.post { color: #7dd3fc; background: rgba(56, 189, 248, .12); }
  .method.delete { color: #fca5a5; background: rgba(248, 113, 113, .12); }
  .api-path { font-family: var(--mono); font-size: 12.5px; color: var(--text); word-break: break-all; }
  .api-desc { margin-left: auto; color: var(--dim); font-size: 11.5px; text-align: right; flex-shrink: 1; }
  .api-body { border-top: 1px solid var(--line); padding: 12px 14px 14px; }
  .api-body h3 { font-size: 11px; font-weight: 600; color: var(--muted); margin: 10px 0 6px; letter-spacing: .3px; }
  .api-body h3:first-child { margin-top: 0; }
  .param { display: flex; gap: 10px; padding: 5px 0; font-size: 12px; border-bottom: 1px dashed var(--line); }
  .param:last-child { border-bottom: 0; }
  .param .pname { font-family: var(--mono); color: #bae6fd; flex-shrink: 0; }
  .param .ptype { color: var(--dim); flex-shrink: 0; }
  .param .pdesc { color: var(--muted); margin-left: auto; text-align: right; }
  .req { color: #fcd34d; font-size: 10px; }
  .schema {
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    background: #0a111b; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; white-space: pre-wrap; line-height: 1.6;
  }
  .api-foot { margin-top: 28px; color: var(--dim); font-size: 11.5px; line-height: 1.8; }
  .api-foot a { color: var(--muted); }
  .api-empty { padding: 30px; text-align: center; color: var(--dim); font-size: 12.5px; }
</style>
</head>
<body>

<div class="api-page">
  <div class="api-head">
    <div class="mark">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.6">
        <circle cx="12" cy="12" r="6.4"></circle>
        <ellipse cx="12" cy="12" rx="10.2" ry="3.4" transform="rotate(-18 12 12)"></ellipse>
      </svg>
    </div>
    <div>
      <h1>M87 API 参考</h1>
      <p>本机接口说明，数据全部同源返回，不依赖任何外部服务。</p>
    </div>
  </div>

  <div class="api-intro">
    <span>接口根地址：<code>http://localhost:8000</code></span>
    <span>协议：HTTP JSON</span>
    <span>实时推送：<code>ws://localhost:8000/ws/sessions/{sid}</code></span>
    <span>机器可读描述：<a href="/openapi.json">/openapi.json</a></span>
  </div>

  <div class="api-search">
    <div class="input-shell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="apiFilter" placeholder="搜索接口，例如 probe、dns、sessions" autocomplete="off" />
    </div>
  </div>

  <div id="apiList"><div class="api-empty">正在读取接口列表...</div></div>

  <div class="api-foot">
    <div>GET 请求用于读取，POST 用于创建或执行，DELETE 用于删除。</div>
    <div>抓包会话的实时数据走 WebSocket，参数 since 表示从第几个包开始，filter 为显示过滤器文本。</div>
    <div><a href="/">返回 M87</a></div>
  </div>
</div>

<script>
(function () {
  const list = document.getElementById('apiList');
  const search = document.getElementById('apiFilter');
  let spec = null;
  let rows = [];

  const METHOD_ORDER = { get: 0, post: 1, delete: 2 };

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function resolve(schema) {
    if (!schema) return null;
    if (schema.$ref && spec.components && spec.components.schemas) {
      const name = schema.$ref.split('/').pop();
      const target = spec.components.schemas[name];
      if (target) return Object.assign({ __name: name }, target);
    }
    return schema;
  }

  function schemaText(schema) {
    const target = resolve(schema);
    if (!target) return '';
    if (target.type === 'array') {
      const inner = schemaText(target.items);
      return '数组，每项：' + (inner || '任意值');
    }
    if (target.properties) {
      return Object.keys(target.properties).map(function (key) {
        const prop = resolve(target.properties[key]) || {};
        const type = prop.type || (prop.$ref ? '对象' : '任意');
        return key + ': ' + type + (prop.description ? '  // ' + prop.description : '');
      }).join('\n');
    }
    if (target.type) return target.type;
    return '';
  }

  function build() {
    const groups = {};
    rows = [];
    Object.keys(spec.paths || {}).forEach(function (path) {
      const ops = spec.paths[path];
      Object.keys(ops).forEach(function (method) {
        if (METHOD_ORDER[method] == null) return;
        const op = ops[method];
        const group = (op.tags && op.tags[0]) || '通用';
        const params = (op.parameters || []).map(function (param) {
          const p = resolve(param) || {};
          return {
            name: p.name || '',
            where: p.in || '',
            required: !!p.required,
            type: (p.schema && p.schema.type) || '',
            desc: p.description || '',
          };
        });
        const bodySchema = op.requestBody && op.requestBody.content
          && op.requestBody.content['application/json']
          && op.requestBody.content['application/json'].schema;
        const item = {
          method: method,
          path: path,
          title: op.summary || op.operationId || '',
          desc: op.description || '',
          group: group,
          params: params,
          body: bodySchema ? schemaText(bodySchema) : '',
        };
        rows.push(item);
        if (!groups[group]) groups[group] = [];
        groups[group].push(item);
      });
    });

    Object.keys(groups).forEach(function (group) {
      groups[group].sort(function (a, b) {
        return METHOD_ORDER[a.method] - METHOD_ORDER[b.method] || a.path.localeCompare(b.path);
      });
    });
    return groups;
  }

  function render(groups) {
    const order = Object.keys(groups);
    if (!order.length) {
      list.innerHTML = '<div class="api-empty">没有匹配的接口</div>';
      return;
    }
    list.innerHTML = order.map(function (group) {
      const items = groups[group].map(function (item) {
        const params = item.params.length
          ? '<h3>查询参数</h3>' + item.params.map(function (p) {
              return '<div class="param"><span class="pname">' + esc(p.name) + '</span>'
                + '<span class="ptype">' + esc(p.type || p.where) + '</span>'
                + (p.required ? '<span class="req">必填</span>' : '')
                + '<span class="pdesc">' + esc(p.desc) + '</span></div>';
            }).join('')
          : '';
        const body = item.body
          ? '<h3>请求体</h3><div class="schema">' + esc(item.body) + '</div>'
          : '';
        return '<details class="api-item"><summary>'
          + '<span class="method ' + item.method + '">' + item.method.toUpperCase() + '</span>'
          + '<span class="api-path">' + esc(item.path) + '</span>'
          + '<span class="api-desc">' + esc(item.title) + '</span></summary>'
          + '<div class="api-body">'
          + (item.desc ? '<h3>说明</h3><div style="font-size:12px;color:var(--muted);line-height:1.7">' + esc(item.desc) + '</div>' : '')
          + params + body
          + '</div></details>';
      }).join('');
      return '<section class="api-group"><h2>' + esc(group) + '</h2>' + items + '</section>';
    }).join('');
  }

  function applyFilter() {
    if (!spec) return;
    const keyword = search.value.trim().toLowerCase();
    const groups = {};
    rows.forEach(function (item) {
      const haystack = (item.path + ' ' + item.title + ' ' + item.desc + ' ' + item.group).toLowerCase();
      if (keyword && haystack.indexOf(keyword) === -1) return;
      if (!groups[item.group]) groups[item.group] = [];
      groups[item.group].push(item);
    });
    render(groups);
  }

  fetch('/openapi.json').then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function (data) {
    spec = data;
    render(build());
    search.addEventListener('input', applyFilter);
  }).catch(function (err) {
    list.innerHTML = '<div class="api-empty">接口描述读取失败：' + esc(err.message) + '</div>';
  });
})();
</script>
</body>
</html>
