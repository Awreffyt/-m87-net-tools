<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e14">
<title>M87 网页分析</title>
<style>
  :root { --bg:#0b0e14; --panel:#131720; --line:#242a36; --text:#e6edf3; --dim:#8b96a8;
          --accent:#2f81f7; --green:#2ea043; --warn:#d29922; --red:#f85149; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px 12px 80px; background:var(--bg); color:var(--text);
         font:15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
  .wrap { max-width:780px; margin:0 auto; }
  h1 { font-size:19px; margin:0 0 3px; }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           padding:12px; margin-bottom:12px; }
  textarea { width:100%; min-height:70px; padding:11px; border-radius:8px; border:1px solid var(--line);
             background:#0d1117; color:var(--text); font-size:14px; outline:none; resize:vertical;
             font-family:ui-monospace, Consolas, monospace; }
  textarea:focus, input[type=text]:focus, input[type=number]:focus, select:focus { border-color:var(--accent); }
  input[type=text], input[type=number], select {
    padding:10px; border-radius:8px; border:1px solid var(--line); background:#0d1117;
    color:var(--text); font-size:14px; outline:none; font-family:inherit; }
  .opts { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:10px; font-size:12.5px; color:var(--dim); }
  .opts label { display:flex; align-items:center; gap:6px; }
  .opts input[type=checkbox] { accent-color:var(--accent); width:15px; height:15px; }
  .opts input[type=number] { width:64px; padding:6px 8px; }
  button { border:0; border-radius:8px; padding:12px 16px; font-size:14px; font-weight:600;
           cursor:pointer; color:#fff; background:var(--accent); font-family:inherit; }
  button:active { opacity:.82; }
  button:disabled { opacity:.45; }
  .btn-main { width:100%; margin-top:12px; padding:14px; font-size:15px; }
  .btn-sec { background:#21262d; color:var(--text); font-weight:500; font-size:12.5px; padding:9px 12px; }
  .status { font-size:12.5px; color:var(--dim); margin:8px 0; min-height:18px; }
  .status.err { color:var(--red); }
  .status.ok { color:var(--green); }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:10px; overflow-x:auto; }
  .tabs button { background:transparent; color:var(--dim); border-radius:8px 8px 0 0; padding:9px 14px;
                 font-size:13px; font-weight:500; white-space:nowrap; }
  .tabs button.on { background:var(--panel); color:var(--text); border:1px solid var(--line); border-bottom-color:var(--panel); margin-bottom:-1px; }
  .tools { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .tools input[type=text] { flex:1; min-width:140px; }
  .tools select { flex:0 0 auto; }
  .count { font-size:12px; color:var(--dim); white-space:nowrap; }
  .group { margin-bottom:10px; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .group-head { display:flex; justify-content:space-between; padding:9px 12px; background:var(--panel);
                font-size:13px; cursor:pointer; }
  .group-head span { color:var(--dim); font-size:12px; }
  .group-body { max-height:340px; overflow:auto; background:#0d1117; }
  .item { display:flex; gap:8px; padding:7px 10px; border-bottom:1px solid #161b22; font-size:12px; align-items:flex-start; }
  .item:last-child { border-bottom:0; }
  .item input { margin-top:3px; accent-color:var(--accent); flex:0 0 auto; }
  .item a { color:#7ee787; text-decoration:none; word-break:break-all; line-height:1.5; }
  .thumb { width:38px; height:38px; object-fit:cover; border-radius:5px; background:#161b22;
           flex:0 0 auto; border:1px solid var(--line); }
  .meta-row { display:flex; gap:10px; padding:8px 10px; border-bottom:1px solid #161b22; font-size:13px; }
  .meta-row:last-child { border-bottom:0; }
  .meta-k { color:var(--dim); flex:0 0 92px; font-size:12px; }
  .meta-v { flex:1; word-break:break-all; }
  pre { background:#0d1117; border:1px solid var(--line); border-radius:8px; padding:12px; margin:0;
        font:12px/1.6 ui-monospace, Consolas, monospace; color:#c9d1d9; white-space:pre-wrap;
        word-break:break-all; max-height:62vh; overflow:auto; }
  .bar { position:sticky; bottom:0; display:flex; gap:8px; padding:10px 0 0;
         background:linear-gradient(180deg, transparent, var(--bg) 40%); }
  .bar button { flex:1; }
  .empty { color:var(--dim); font-size:13px; text-align:center; padding:26px 0; }
  .dnsform { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .dnsform input { flex:1; min-width:150px; }
  .dns-out { font:12px/1.7 ui-monospace, Consolas, monospace; }
  .dns-line { padding:6px 10px; border-bottom:1px solid #161b22; word-break:break-all; }
  .dns-line b { color:#79c0ff; font-weight:600; }
  details.hist { margin-top:14px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  details.hist summary { font-size:13px; color:var(--dim); cursor:pointer; }
  .hist-item { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid #161b22; font-size:12px; }
  .hist-item:last-child { border-bottom:0; }
  .hist-item a { color:#7ee787; text-decoration:none; word-break:break-all; }
  .tip { font-size:12px; color:var(--dim); margin-top:14px; line-height:1.7; }
  .tip b { color:var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <h1>M87 网页分析</h1>
  <div class="sub">资源提取 · 页面信息 · 源码 · DNS</div>

  <div class="panel">
    <textarea id="urls" placeholder="输入网址，一行一个&#10;example.com&#10;https://example.org/page"></textarea>
    <div class="opts">
      <label><input type="checkbox" id="deep"> 递归抓同域链接</label>
      <label>最多 <input type="number" id="maxpages" value="5" min="1" max="15"> 页</label>
      <label><input type="checkbox" id="withLinks" checked> 含页面链接</label>
    </div>
    <button id="go" class="btn-main">开始分析</button>
    <div id="status" class="status"></div>
  </div>

  <div class="tabs">
    <button data-tab="res" class="on">资源</button>
    <button data-tab="meta">页面信息</button>
    <button data-tab="src">源码</button>
    <button data-tab="dns">DNS</button>
  </div>

  <section id="tab-res">
    <div class="tools">
      <input id="q" type="text" placeholder="筛选，例如 .png 或 api">
      <select id="catSel"><option value="">全部类型</option></select>
      <span class="count" id="cnt">0 项</span>
    </div>
    <div id="list"><div class="empty">还没有结果</div></div>
    <div class="bar">
      <button id="copyBtn" class="btn-sec">复制选中</button>
      <button id="jsonBtn" class="btn-sec">导出 JSON</button>
      <button id="txtBtn" class="btn-sec">导出 TXT</button>
    </div>
  </section>

  <section id="tab-meta" hidden>
    <div id="metaList"><div class="empty">还没有结果</div></div>
  </section>

  <section id="tab-src" hidden>
    <pre id="srcBox">还没有结果</pre>
  </section>

  <section id="tab-dns" hidden>
    <div class="dnsform">
      <input id="dnsName" type="text" placeholder="域名，例如 example.com">
      <select id="dnsType">
        <option value="1">A</option>
        <option value="28">AAAA</option>
        <option value="5">CNAME</option>
        <option value="15">MX</option>
        <option value="16">TXT</option>
        <option value="2">NS</option>
        <option value="6">SOA</option>
        <option value="257">CAA</option>
      </select>
      <button id="dnsGo" class="btn-sec">查询</button>
    </div>
    <div id="dnsOut" class="dns-out"></div>
  </section>

  <details class="hist">
    <summary id="histSum">历史记录</summary>
    <div id="histList"></div>
  </details>

  <div class="tip">
    <b>说明：</b>纯静态页面，优先借用公开抓取接口，失败自动切换备用代理。<br>
    动态加载的资源、需要登录的内容抓不到；少数站点会拒绝代理访问。
  </div>
</div>

<script>
var PROXIES = [
  function (u) { return 'https://xmokyimajkzuvbzbyqqb.supabase.co/functions/v1/site-tools?action=fetch&url=' + encodeURIComponent(u); },
  function (u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
  function (u) { return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); },
  function (u) { return 'https://corsproxy.io/?url=' + encodeURIComponent(u); }
];

var CATS = ['图片', '脚本', '样式', '字体', '媒体', '框架', '链接', '接口'];
var TYPE_NAMES = {1:'A',2:'NS',5:'CNAME',6:'SOA',15:'MX',16:'TXT',28:'AAAA',257:'CAA'};
var DOH = [
  'https://dns.alidns.com/resolve',
  'https://doh.pub/dns-query',
  'https://cloudflare-dns.com/dns-query'
];

var found = {};
var metaAll = [];
var srcAll = '';
var lastUrl = '';
var currentTab = 'res';

function resetFound() {
  found = {};
  CATS.forEach(function (c) { found[c] = []; });
  metaAll = [];
  srcAll = '';
}

function abs(u, base) {
  if (!u) return null;
  u = String(u).trim().replace(/^["']|["']$/g, '');
  if (!u || /^(data|blob|javascript|mailto|tel|about):/i.test(u)) return null;
  if (u.charAt(0) === '#') return null;
  try {
    var x = new URL(u, base);
    if (x.protocol !== 'http:' && x.protocol !== 'https:') return null;
    return x.href;
  } catch (e) { return null; }
}

function add(cat, u) {
  if (!u) return;
  var arr = found[cat] || (found[cat] = []);
  if (arr.indexOf(u) < 0) arr.push(u);
}

async function fetchText(url) {
  var lastErr = '';
  for (var i = 0; i < PROXIES.length; i++) {
    try {
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 14000);
      var r = await fetch(PROXIES[i](url), { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(timer);
      if (!r.ok) { lastErr = 'HTTP ' + r.status; continue; }
      var t = await r.text();
      if (t && t.length > 30) return t;
      lastErr = '空内容';
    } catch (e) {
      lastErr = e.message || '超时';
    }
  }
  throw new Error('代理全部失败（' + lastErr + '）');
}

function metaOf(doc, base) {
  function m(sel, attr) {
    var el = doc.querySelector(sel);
    if (!el) return '';
    return el.getAttribute(attr || 'content') || '';
  }
  var fav = doc.querySelector('link[rel*="icon"][href]');
  return {
    '标题': (doc.title || '').trim(),
    '描述': m('meta[name="description"]'),
    '关键词': m('meta[name="keywords"]'),
    '作者': m('meta[name="author"]'),
    'og 标题': m('meta[property="og:title"]'),
    'og 描述': m('meta[property="og:description"]'),
    'og 图片': abs(m('meta[property="og:image"]'), base) || '',
    'canonical': abs(m('link[rel="canonical"]', 'href'), base) || '',
    '图标': fav ? (abs(fav.getAttribute('href'), base) || '') : '',
    '生成器': m('meta[name="generator"]'),
    '语言': (doc.documentElement.getAttribute('lang') || ''),
    '页面地址': base
  };
}

/* ======== 深度挖掘：还原被编码 / 拼接 / 转义过的资源地址 ======== */

var PATH_RE_SRC = '(?:/|\\.{1,2}/)[^\\s"\'`<>]+?\\.(?:png|jpe?g|gif|webp|svg|bmp|ico|avif|woff2?|ttf|otf|eot|css|m?js|mp4|webm|ogv|m4v|mov|mp3|wav|m4a|flac|aac|ogg|json|xml|pdf|zip)(?:\\?[^\\s"\'`<>]*)?';

function printableRatio(v) {
  if (!v) return 0;
  var p = 0;
  for (var i = 0; i < v.length; i++) {
    var c = v.charCodeAt(i);
    if (c >= 32 && c !== 127) p++;
  }
  return p / v.length;
}

function rot13(s) {
  return s.replace(/[a-zA-Z]/g, function (c) {
    var base = c <= 'Z' ? 65 : 97;
    return String.fromCharCode((c.charCodeAt(0) - base + 13) % 26 + base);
  });
}

/* 尝试所有常见编码：unicode 转义 / URL 编码 / Base64 / Hex / ROT13 */
function tryDecode(s) {
  var out = [], seen = {};
  function push(v) {
    if (v && v !== s && !seen[v] && printableRatio(v) > 0.6) { seen[v] = 1; out.push(v); }
  }
  if (!s || s.length < 4) return out;

  if (/\\u[0-9a-fA-F]{4}|\\x[0-9a-fA-F]{2}/.test(s)) {
    try {
      push(s.replace(/\\u([0-9a-fA-F]{4})/g, function (_, h) {
        return String.fromCharCode(parseInt(h, 16));
      }).replace(/\\x([0-9a-fA-F]{2})/g, function (_, h) {
        return String.fromCharCode(parseInt(h, 16));
      }));
    } catch (e) {}
  }

  if (s.indexOf('%') >= 0) {
    try { push(decodeURIComponent(s)); } catch (e) {}
  }

  var t = s.trim();
  if (/^[A-Za-z0-9+\/_-]{8,}={0,2}$/.test(t)) {
    try {
      var b = t.replace(/-/g, '+').replace(/_/g, '/');
      var pad = b.length % 4;
      if (pad === 2) b += '==';
      else if (pad === 3) b += '=';
      else if (pad === 1) b = '';
      if (b) push(atob(b));
    } catch (e) {}
  }

  if (/^[0-9a-fA-F]+$/.test(t) && t.length % 2 === 0) {
    try {
      var hex = '';
      for (var i = 0; i < t.length; i += 2) hex += String.fromCharCode(parseInt(t.substr(i, 2), 16));
      push(hex);
    } catch (e) {}
  }

  if (/[a-zA-Z]/.test(s)) {
    var r13 = rot13(s);
    /* ROT13 误报率高，只在结果本身是完整资源路径时才收 */
    if (new RegExp('^(?:' + PATH_RE_SRC + ')$', 'i').test(r13)) push(r13);
  }
  return out;
}

/* 把 "a" + "b" + "c" 折叠成一个完整字符串，还原被拆散的资源地址 */
function mergeConcat(text) {
  var re = /(["'`])((?:\\.|[^"'`\\])*)\1(?:\s*\+\s*(["'`])((?:\\.|[^"'`\\])*)\3)+/g;
  return text.replace(re, function (m) {
    var parts = [], sr = /(["'`])((?:\\.|[^"'`\\])*)\1/g, x;
    while ((x = sr.exec(m)) !== null) parts.push(x[2]);
    return '"' + parts.join('') + '"';
  });
}

/* 按扩展名归类 */
function catOf(u) {
  var p = u.split('?')[0].split('#')[0].toLowerCase();
  if (/\.(png|jpe?g|gif|webp|svg|bmp|ico|avif)$/.test(p)) return '图片';
  if (/\.(woff2?|ttf|otf|eot)$/.test(p)) return '字体';
  if (/\.css$/.test(p)) return '样式';
  if (/\.m?js$/.test(p)) return '脚本';
  if (/\.(mp4|webm|ogv|m4v|mov|mp3|wav|m4a|flac|aac|ogg)$/.test(p)) return '媒体';
  if (/\.(json|xml|pdf|zip|gz|rar)$/.test(p)) return '接口';
  if (/\/api\b|api\.|\/v\d+\/|\.php$/.test(p)) return '接口';
  return '链接';
}

/* 从一个 JS 片段 / HTML 文本里挖出所有可能的资源地址，返回新增条数 */
function deepMineJs(text, base) {
  if (!text) return 0;
  var n = 0;
  function feed(u) {
    if (!u || u.length > 2048) return;
    var a = abs(u, base);
    if (!a) return;
    add(catOf(a), a);
    n++;
  }
  var merged = mergeConcat(text);
  var m, re;

  re = /https?:\/\/[^\s"'`<>()\\]+/gi;
  while ((m = re.exec(merged)) !== null) feed(m[0]);

  re = new RegExp(PATH_RE_SRC, 'gi');
  while ((m = re.exec(merged)) !== null) feed(m[0]);

  re = /"((?:\\.|[^"\\])*)"|'((?:\\.|[^'\\])*)'|`((?:\\.|[^`\\])*)`/g;
  while ((m = re.exec(merged)) !== null) {
    var s = m[1] !== undefined ? m[1] : (m[2] !== undefined ? m[2] : m[3]);
    if (!s || s.length < 4) continue;
    if (/^(https?:\/\/|\.{0,2}\/)/i.test(s)) feed(s);
    var ds = tryDecode(s);
    for (var i = 0; i < ds.length; i++) {
      if (/^(https?:\/\/|\.{0,2}\/)/i.test(ds[i])) feed(ds[i]);
      var x, r2 = /https?:\/\/[^\s"'`<>()\\]+/gi;
      while ((x = r2.exec(ds[i])) !== null) feed(x[0]);
      var r3 = new RegExp(PATH_RE_SRC, 'gi');
      while ((x = r3.exec(ds[i])) !== null) feed(x[0]);
    }
  }

  re = /(?:fetch|axios\.get|axios\.post|axios|XMLHttpRequest|\.ajax)\s*\(\s*["'`]([^"'`]+)["'`]/gi;
  while ((m = re.exec(text)) !== null) feed(m[1]);

  return n;
}

function extract(html, base) {
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var b = doc.querySelector('base[href]');
  if (b) { var bb = abs(b.getAttribute('href'), base); if (bb) base = bb; }

  doc.querySelectorAll('img').forEach(function (el) {
    add('图片', abs(el.getAttribute('src'), base));
    add('图片', abs(el.getAttribute('data-src'), base));
    add('图片', abs(el.getAttribute('data-original'), base));
    add('图片', abs(el.getAttribute('data-lazy-src'), base));
    var ss = el.getAttribute('srcset') || el.getAttribute('data-srcset');
    if (ss) ss.split(',').forEach(function (p) { add('图片', abs(p.trim().split(/\s+/)[0], base)); });
  });

  doc.querySelectorAll('link[href]').forEach(function (el) {
    var rel = (el.getAttribute('rel') || '').toLowerCase();
    var href = abs(el.getAttribute('href'), base);
    if (!href) return;
    if (rel.indexOf('stylesheet') >= 0) add('样式', href);
    else if (rel.indexOf('icon') >= 0) add('图片', href);
    else if (rel.indexOf('preload') >= 0) {
      var as = (el.getAttribute('as') || '').toLowerCase();
      if (as === 'font') add('字体', href);
      else if (as === 'image') add('图片', href);
      else if (as === 'script') add('脚本', href);
      else if (as === 'style') add('样式', href);
    }
  });

  doc.querySelectorAll('script[src]').forEach(function (el) { add('脚本', abs(el.getAttribute('src'), base)); });

  doc.querySelectorAll('video,audio,source').forEach(function (el) {
    add('媒体', abs(el.getAttribute('src'), base));
    var ss = el.getAttribute('srcset');
    if (ss) ss.split(',').forEach(function (p) { add('媒体', abs(p.trim().split(/\s+/)[0], base)); });
  });

  doc.querySelectorAll('video[poster]').forEach(function (el) { add('图片', abs(el.getAttribute('poster'), base)); });
  doc.querySelectorAll('iframe[src]').forEach(function (el) { add('框架', abs(el.getAttribute('src'), base)); });
  doc.querySelectorAll('a[href]').forEach(function (el) { add('链接', abs(el.getAttribute('href'), base)); });

  var cssText = '';
  doc.querySelectorAll('style').forEach(function (el) { cssText += el.textContent; });
  doc.querySelectorAll('[style]').forEach(function (el) { cssText += el.getAttribute('style'); });
  (cssText.match(/url\(\s*['"]?([^'")]+)['"]?\s*\)/gi) || []).forEach(function (s) {
    add('图片', abs(s.replace(/^url\(\s*['"]?/i, '').replace(/['"]?\s*\)$/, ''), base));
  });

  var body = doc.body ? doc.body.innerHTML : '';
  var apiRe = /["']((?:https?:\/\/|\/)[^"'<> ]{4,300}?(?:\.json|api[^"'<> ]{0,120}|\.php))["']/gi;
  var mm;
  while ((mm = apiRe.exec(body)) !== null) add('接口', abs(mm[1], base));

  var links = [];
  doc.querySelectorAll('a[href]').forEach(function (el) {
    var h = abs(el.getAttribute('href'), base);
    if (h && h.indexOf('http') === 0) links.push(h);
  });

  /* 深度挖掘：内联脚本 + 整页文本，还原 Base64/Hex/Unicode/URL编码/字符串拼接 的资源地址 */
  var jsInline = '';
  doc.querySelectorAll('script:not([src])').forEach(function (el) { jsInline += el.textContent + '\n'; });
  if (jsInline) deepMineJs(jsInline, base);
  if (doc.body && doc.body.innerHTML) deepMineJs(doc.body.innerHTML, base);

  var meta = metaOf(doc, base);
  metaAll.push(meta);

  return { links: links, doc: doc, _jsHint: jsInline };
}

function sameOriginLink(link, base) {
  try {
    var a = new URL(link), b = new URL(base);
    if (a.host !== b.host) return false;
    if (/\.(png|jpe?g|gif|svg|webp|ico|pdf|zip|rar|7z|mp4|mp3|css|js|woff2?|ttf|otf)$/i.test(a.pathname)) return false;
    return true;
  } catch (e) { return false; }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function fillCatSelect() {
  var sel = document.getElementById('catSel');
  sel.innerHTML = '<option value="">全部类型</option>';
  CATS.forEach(function (c) {
    if (!found[c] || !found[c].length) return;
    var o = document.createElement('option');
    o.value = c; o.textContent = c + '（' + found[c].length + '）';
    sel.appendChild(o);
  });
}

function renderList() {
  var box = document.getElementById('list');
  var q = (document.getElementById('q').value || '').toLowerCase().trim();
  var cat = document.getElementById('catSel').value;
  var total = 0;
  CATS.forEach(function (c) { total += found[c].length; });

  if (!total) {
    box.innerHTML = '<div class="empty">没有找到资源</div>';
    document.getElementById('cnt').textContent = '0 项';
    return;
  }

  var shown = 0;
  var html = '';
  CATS.forEach(function (c) {
    if (cat && cat !== c) return;
    var arr = found[c].filter(function (u) { return !q || u.toLowerCase().indexOf(q) >= 0; });
    if (!arr.length) return;
    shown += arr.length;
    var id = 'g_' + c;
    html += '<div class="group"><div class="group-head" data-t="' + id + '"><b>' + c +
            '</b><span>' + arr.length + ' 项</span></div><div class="group-body" id="' + id + '">';
    arr.forEach(function (u) {
      var isImg = c === '图片' && /\.(png|jpe?g|gif|webp|svg|ico|avif)(\?|$)/i.test(u);
      html += '<div class="item">' +
              '<input type="checkbox" checked data-cat="' + c + '" data-url="' + esc(u) + '">' +
              (isImg ? '<img class="thumb" loading="lazy" src="' + esc(u) + '" alt="">' : '') +
              '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(u) + '</a></div>';
    });
    html += '</div></div>';
  });

  box.innerHTML = html || '<div class="empty">没有匹配的资源</div>';
  document.getElementById('cnt').textContent = shown + ' / ' + total + ' 项';

  box.querySelectorAll('.group-head').forEach(function (h) {
    h.onclick = function () {
      var b = document.getElementById(h.dataset.t);
      b.style.display = b.style.display === 'none' ? 'block' : 'none';
    };
  });
}

function renderMeta() {
  var box = document.getElementById('metaList');
  if (!metaAll.length) { box.innerHTML = '<div class="empty">还没有结果</div>'; return; }
  var html = '';
  metaAll.forEach(function (m, i) {
    html += '<div class="panel" style="padding:0;overflow:hidden;margin-bottom:10px">';
    html += '<div style="padding:9px 12px;background:var(--panel);font-size:12.5px;color:var(--dim)">第 ' + (i + 1) + ' 页</div>';
    Object.keys(m).forEach(function (k) {
      if (!m[k]) return;
      html += '<div class="meta-row"><div class="meta-k">' + esc(k) + '</div><div class="meta-v">' + esc(m[k]) + '</div></div>';
    });
    html += '</div>';
  });
  box.innerHTML = html;
}

function setStatus(msg, cls) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.tab === name);
  });
  ['res', 'meta', 'src', 'dns'].forEach(function (n) {
    document.getElementById('tab-' + n).hidden = (n !== name);
  });
}

async function run() {
  var raw = document.getElementById('urls').value.trim();
  if (!raw) { setStatus('先填网址', 'err'); return; }
  var list = raw.split(/[\n,，\s]+/).filter(Boolean);
  var urls = list.map(function (u) { return /^https?:\/\//i.test(u) ? u : 'https://' + u; });

  var deep = document.getElementById('deep').checked;
  var maxPages = Math.max(1, Math.min(15, parseInt(document.getElementById('maxpages').value, 10) || 5));
  var withLinks = document.getElementById('withLinks').checked;

  resetFound();
  document.getElementById('list').innerHTML = '<div class="empty">抓取中</div>';
  document.getElementById('metaList').innerHTML = '<div class="empty">抓取中</div>';
  document.getElementById('srcBox').textContent = '抓取中';
  document.getElementById('go').disabled = true;
  switchTab('res');
  setStatus('开始分析 ' + urls.length + ' 个网址');

  var queue = urls.map(function (u) { return { url: u, d: 0 }; });
  var seen = {};
  var ok = 0, fail = 0, lastErr = '';

  try {
    while (queue.length && ok < maxPages) {
      var job = queue.shift();
      if (seen[job.url]) continue;
      seen[job.url] = 1;
      setStatus('抓取 ' + job.url + '（成功 ' + ok + ' 页）');
      var html;
      try {
        html = await fetchText(job.url);
      } catch (e) {
        fail++; lastErr = e.message; continue;
      }
      ok++;
      lastUrl = job.url;
      if (!srcAll) srcAll = html;
      var r = extract(html, job.url);
      /* 外部 JS 二次挖掘：抓同源脚本，解出里面被编码/拼接的资源地址 */
      if (deep) {
        var jsSeen = {}, jsList = (found['脚本'] || []).slice(0, 6), jsTried = 0;
        for (var ji = 0; ji < jsList.length && jsTried < 3; ji++) {
          var ju = jsList[ji];
          if (!ju || jsSeen[ju]) continue;
          jsSeen[ju] = 1;
          jsTried++;
          try {
            setStatus('深挖脚本 ' + ju);
            var jtext = await fetchText(ju);
            deepMineJs(jtext, ju);
          } catch (e) {}
        }
      }
      if (deep && job.d < 1) {
        var picks = 0;
        for (var i = 0; i < r.links.length && picks < 4 && ok + queue.length < maxPages; i++) {
          if (sameOriginLink(r.links[i], urls[0]) && !seen[r.links[i]]) {
            queue.push({ url: r.links[i], d: job.d + 1 });
            picks++;
          }
        }
      }
    }

    if (!ok) throw new Error(lastErr || '全部失败');

    if (!withLinks) found['链接'] = [];
    fillCatSelect();
    renderList();
    renderMeta();
    document.getElementById('srcBox').textContent = srcAll;
    setStatus('完成，成功 ' + ok + ' 页' + (fail ? '，失败 ' + fail + ' 页' : ''), 'ok');
    saveHistory(urls[0], ok);
  } catch (e) {
    setStatus('失败：' + e.message, 'err');
    document.getElementById('list').innerHTML = '<div class="empty">抓取失败</div>';
  } finally {
    document.getElementById('go').disabled = false;
  }
}

function selected() {
  var out = [];
  document.querySelectorAll('#list input[type=checkbox]').forEach(function (cb) {
    if (cb.checked) out.push({ cat: cb.dataset.cat, url: cb.dataset.url });
  });
  return out;
}

async function copyText(text, okMsg) {
  try {
    await navigator.clipboard.writeText(text);
    setStatus(okMsg, 'ok');
  } catch (e) {
    var t = document.createElement('textarea');
    t.value = text;
    document.body.appendChild(t);
    t.select();
    document.execCommand('copy');
    t.remove();
    setStatus(okMsg, 'ok');
  }
}

function download(name, text, type) {
  var blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
}

async function doh(name, type) {
  var lastErr = '';
  for (var i = 0; i < DOH.length; i++) {
    try {
      var r = await fetch(DOH[i] + '?name=' + encodeURIComponent(name) + '&type=' + type, {
        headers: { accept: 'application/dns-json' }
      });
      if (!r.ok) { lastErr = 'HTTP ' + r.status; continue; }
      var j = await r.json();
      if (j && typeof j.Status !== 'undefined') return j;
    } catch (e) { lastErr = e.message; }
  }
  throw new Error('DNS 查询失败（' + lastErr + '）');
}

function saveHistory(url, pages) {
  try {
    var h = JSON.parse(localStorage.getItem('m87_hist') || '[]');
    h = h.filter(function (x) { return x.url !== url; });
    h.unshift({ url: url, t: Date.now(), p: pages });
    localStorage.setItem('m87_hist', JSON.stringify(h.slice(0, 20)));
    renderHistory();
  } catch (e) {}
}

function renderHistory() {
  var box = document.getElementById('histList');
  var h = [];
  try { h = JSON.parse(localStorage.getItem('m87_hist') || '[]'); } catch (e) {}
  document.getElementById('histSum').textContent = '历史记录（' + h.length + '）';
  if (!h.length) { box.innerHTML = '<div class="empty" style="padding:14px 0">暂无</div>'; return; }
  box.innerHTML = h.map(function (x) {
    return '<div class="hist-item"><a href="#" data-u="' + esc(x.url) + '">' + esc(x.url) + '</a>' +
           '<span style="color:var(--dim)">' + x.p + ' 页</span></div>';
  }).join('');
  box.querySelectorAll('a[data-u]').forEach(function (a) {
    a.onclick = function (e) {
      e.preventDefault();
      document.getElementById('urls').value = a.dataset.u;
      document.getElementById('urls').focus();
    };
  });
}

document.getElementById('go').onclick = run;
document.querySelectorAll('.tabs button').forEach(function (b) {
  b.onclick = function () { switchTab(b.dataset.tab); };
});
document.getElementById('q').oninput = renderList;
document.getElementById('catSel').onchange = renderList;

document.getElementById('copyBtn').onclick = function () {
  var s = selected();
  if (!s.length) { setStatus('没有选中项', 'err'); return; }
  copyText(s.map(function (x) { return x.url; }).join('\n'), '已复制 ' + s.length + ' 条链接');
};

document.getElementById('txtBtn').onclick = function () {
  var s = selected();
  if (!s.length) { setStatus('没有选中项', 'err'); return; }
  var lines = [];
  CATS.forEach(function (c) {
    var part = s.filter(function (x) { return x.cat === c; });
    if (!part.length) return;
    lines.push('=== ' + c + '（' + part.length + '）===');
    part.forEach(function (x) { lines.push(x.url); });
    lines.push('');
  });
  download('m87-resources.txt', lines.join('\n'));
  setStatus('清单已下载', 'ok');
};

document.getElementById('jsonBtn').onclick = function () {
  var s = selected();
  var data = {
    source: lastUrl,
    time: new Date().toISOString(),
    pages: metaAll,
    resources: {}
  };
  CATS.forEach(function (c) {
    var part = s.filter(function (x) { return x.cat === c; }).map(function (x) { return x.url; });
    if (part.length) data.resources[c] = part;
  });
  download('m87-resources.json', JSON.stringify(data, null, 2), 'application/json;charset=utf-8');
  setStatus('JSON 已下载', 'ok');
};

document.getElementById('dnsGo').onclick = async function () {
  var name = document.getElementById('dnsName').value.trim();
  var type = document.getElementById('dnsType').value;
  if (!name) { setStatus('先填域名', 'err'); switchTab('dns'); return; }
  var out = document.getElementById('dnsOut');
  out.innerHTML = '<div class="dns-line">查询中</div>';
  try {
    var j = await doh(name, type);
    var html = '';
    if (j.Status !== 0) {
      html = '<div class="dns-line">查询返回状态 ' + j.Status + '（3 表示域名不存在）</div>';
    } else if (j.Answer && j.Answer.length) {
      j.Answer.forEach(function (a) {
        html += '<div class="dns-line"><b>' + (TYPE_NAMES[a.type] || a.type) + '</b>  ' +
                esc(a.data) + '<span style="color:var(--dim)">  TTL ' + a.TTL + '</span></div>';
      });
    } else {
      html = '<div class="dns-line">没有记录</div>';
    }
    out.innerHTML = html;
  } catch (e) {
    out.innerHTML = '<div class="dns-line" style="color:var(--red)">' + esc(e.message) + '</div>';
  }
};

document.getElementById('dnsName').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('dnsGo').click();
});

renderHistory();
resetFound();
</script>
</body>
</html>
