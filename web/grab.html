<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M87 资源抓取</title>
<style>
  :root { --bg:#0b0e14; --panel:#131720; --line:#242a36; --text:#e6edf3; --dim:#8b96a8;
          --accent:#2f81f7; --green:#2ea043; --warn:#d29922; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:18px 14px 60px; background:var(--bg); color:var(--text);
         font:15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; letter-spacing:.5px; }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:18px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           padding:14px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--dim); margin-bottom:6px; }
  input[type=text] { width:100%; padding:12px; border-radius:8px; border:1px solid var(--line);
                     background:#0d1117; color:var(--text); font-size:15px; outline:none; }
  input[type=text]:focus { border-color:var(--accent); }
  .row { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .row label { margin:0; display:flex; align-items:center; gap:6px; font-size:13px; }
  button { border:0; border-radius:8px; padding:13px 18px; font-size:15px; font-weight:600;
           cursor:pointer; color:#fff; background:var(--accent); }
  button:active { opacity:.82; }
  button:disabled { opacity:.45; cursor:default; }
  .btn-main { width:100%; margin-top:12px; padding:15px; font-size:16px; }
  .btn-sec { background:#21262d; color:var(--text); font-weight:500; font-size:13px; padding:10px 14px; }
  .status { font-size:13px; color:var(--dim); margin-top:12px; min-height:20px; }
  .status.err { color:#f85149; }
  .status.ok { color:var(--green); }
  .group { margin-bottom:14px; }
  .group-head { display:flex; justify-content:space-between; align-items:center;
                padding:10px 12px; background:var(--panel); border:1px solid var(--line);
                border-radius:8px 8px 0 0; cursor:pointer; font-size:13.5px; }
  .group-head b { font-weight:600; }
  .group-head span { color:var(--dim); font-size:12.5px; }
  .group-body { border:1px solid var(--line); border-top:0; border-radius:0 0 8px 8px;
                max-height:320px; overflow:auto; background:#0d1117; }
  .item { display:flex; gap:9px; padding:8px 12px; border-bottom:1px solid #161b22;
          font-size:12px; align-items:flex-start; }
  .item:last-child { border-bottom:0; }
  .item input { margin-top:3px; accent-color:var(--accent); flex:0 0 auto; }
  .item a { color:#7ee787; text-decoration:none; word-break:break-all; line-height:1.5; }
  .item a:hover { text-decoration:underline; }
  .bar { position:sticky; bottom:0; display:flex; gap:8px; padding:12px 0 0;
         background:linear-gradient(180deg, transparent, var(--bg) 30%); }
  .bar button { flex:1; }
  .empty { color:var(--dim); font-size:13px; text-align:center; padding:30px 0; }
  .tip { font-size:12px; color:var(--dim); margin-top:14px; line-height:1.7; }
  .tip b { color:var(--warn); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>M87 资源抓取</h1>
  <div class="sub">填网址，把这页能拿到的资源全部列出来</div>

  <div class="panel">
    <label>目标网址</label>
    <input id="url" type="text" placeholder="example.com 或 https://example.com/page" autocomplete="off" spellcheck="false">
    <div class="row">
      <label><input id="deep" type="checkbox"> 顺带抓同域链接（最多 5 页，慢）</label>
      <label><input id="withLinks" type="checkbox" checked> 包含页面链接</label>
    </div>
    <button id="go" class="btn-main">开始抓取</button>
    <div id="status" class="status"></div>
  </div>

  <div id="result"></div>

  <div class="bar" id="bar" style="display:none">
    <button id="copyAll" class="btn-sec">复制选中链接</button>
    <button id="saveAll" class="btn-sec">下载清单</button>
  </div>

  <div class="tip">
    <b>说明：</b>本页是纯静态页面，靠公开的跨域代理去取目标网页，所以不需要服务器、不需要安装、随时可打开。<br>
    动态加载（滚动后才出现的图片）和需要登录的内容抓不到，少数站点会拒绝代理访问。多试一次或换个网址即可。
  </div>
</div>

<script>
var PROXIES = [
  function (u) { return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); },
  function (u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
  function (u) { return 'https://corsproxy.io/?url=' + encodeURIComponent(u); },
  function (u) { return 'https://api.cors.lol/?url=' + encodeURIComponent(u); }
];

var CATS = ['图片', '脚本', '样式', '字体', '媒体', '框架', '链接', '接口'];
var found = {};
var pageTitle = '';

function clearFound() {
  found = {};
  CATS.forEach(function (c) { found[c] = []; });
}

function abs(u, base) {
  if (!u) return null;
  u = String(u).trim().replace(/^["']|["']$/g, '');
  if (!u || /^(data|blob|javascript|mailto|tel|about):/i.test(u)) return null;
  if (u.indexOf('#') === 0) return null;
  try {
    var x = new URL(u, base);
    if (x.protocol !== 'http:' && x.protocol !== 'https:') return null;
    return x.href;
  } catch (e) { return null; }
}

function add(cat, u) {
  if (!u) return;
  var arr = found[cat];
  if (arr.indexOf(u) < 0) arr.push(u);
}

async function fetchText(url) {
  var lastErr = null;
  for (var i = 0; i < PROXIES.length; i++) {
    try {
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 25000);
      var r = await fetch(PROXIES[i](url), { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(timer);
      if (!r.ok) { lastErr = 'HTTP ' + r.status; continue; }
      var t = await r.text();
      if (t && t.length > 30) return t;
      lastErr = '空内容';
    } catch (e) {
      lastErr = e.message || '超时';
    }
  }
  throw new Error('代理全部失败（' + (lastErr || '未知') + '）');
}

function extract(html, base) {
  var doc = new DOMParser().parseFromString(html, 'text/html');
  pageTitle = (doc.title || '').trim();

  var b = doc.querySelector('base[href]');
  if (b) { var bb = abs(b.getAttribute('href'), base); if (bb) base = bb; }

  doc.querySelectorAll('img').forEach(function (el) {
    add('图片', abs(el.getAttribute('src'), base));
    var ss = el.getAttribute('srcset') || el.getAttribute('data-srcset');
    if (ss) ss.split(',').forEach(function (p) { add('图片', abs(p.trim().split(/\s+/)[0], base)); });
    add('图片', abs(el.getAttribute('data-src'), base));
    add('图片', abs(el.getAttribute('data-original'), base));
    add('图片', abs(el.getAttribute('data-lazy-src'), base));
  });

  doc.querySelectorAll('link[href]').forEach(function (el) {
    var rel = (el.getAttribute('rel') || '').toLowerCase();
    var href = abs(el.getAttribute('href'), base);
    if (!href) return;
    if (rel.indexOf('stylesheet') >= 0) add('样式', href);
    else if (rel.indexOf('icon') >= 0) add('图片', href);
    else if (rel.indexOf('preload') >= 0) {
      var as = (el.getAttribute('as') || '').toLowerCase();
      if (as === 'font') add('字体', href);
      else if (as === 'image') add('图片', href);
      else if (as === 'script') add('脚本', href);
      else if (as === 'style') add('样式', href);
    }
  });

  doc.querySelectorAll('script[src]').forEach(function (el) {
    add('脚本', abs(el.getAttribute('src'), base));
  });

  doc.querySelectorAll('video,audio,source').forEach(function (el) {
    add('媒体', abs(el.getAttribute('src'), base));
    var ss = el.getAttribute('srcset');
    if (ss) ss.split(',').forEach(function (p) { add('媒体', abs(p.trim().split(/\s+/)[0], base)); });
  });

  doc.querySelectorAll('video[poster]').forEach(function (el) {
    add('图片', abs(el.getAttribute('poster'), base));
  });

  doc.querySelectorAll('iframe[src]').forEach(function (el) {
    add('框架', abs(el.getAttribute('src'), base));
  });

  doc.querySelectorAll('a[href]').forEach(function (el) {
    add('链接', abs(el.getAttribute('href'), base));
  });

  var cssText = '';
  doc.querySelectorAll('style').forEach(function (el) { cssText += el.textContent; });
  doc.querySelectorAll('[style]').forEach(function (el) { cssText += el.getAttribute('style'); });
  var m = cssText.match(/url\(\s*['"]?([^'")]+)['"]?\s*\)/gi) || [];
  m.forEach(function (s) {
    var u = s.replace(/^url\(\s*['"]?/i, '').replace(/['"]?\s*\)$/, '');
    add('图片', abs(u, base));
  });

  var body = doc.body ? doc.body.innerHTML : '';
  var apiRe = /["']((?:https?:\/\/|\/)[^"'<> ]{4,300}?(?:\.json|api[^"'<> ]{0,120}|\.php))["']/gi;
  var mm;
  while ((mm = apiRe.exec(body)) !== null) add('接口', abs(mm[1], base));

  var links = [];
  doc.querySelectorAll('a[href]').forEach(function (el) {
    var h = abs(el.getAttribute('href'), base);
    if (h && h.indexOf('http') === 0) links.push(h);
  });
  return links;
}

function sameOriginLink(link, base) {
  try {
    var a = new URL(link), b = new URL(base);
    if (a.host !== b.host) return false;
    if (/\.(png|jpe?g|gif|svg|webp|ico|pdf|zip|rar|mp4|mp3|css|js|woff2?|ttf)$/i.test(a.pathname)) return false;
    return true;
  } catch (e) { return false; }
}

function render() {
  var box = document.getElementById('result');
  var total = 0;
  CATS.forEach(function (c) { total += found[c].length; });

  if (!total) {
    box.innerHTML = '<div class="empty">没有找到资源</div>';
    document.getElementById('bar').style.display = 'none';
    return;
  }

  var html = '<div class="panel" style="padding:12px 14px;color:var(--dim);font-size:12.5px">' +
             (pageTitle ? ('页面标题：' + escapeHtml(pageTitle) + '<br>') : '') +
             '共找到 <b style="color:var(--text)">' + total + '</b> 项资源</div>';

  CATS.forEach(function (c) {
    if (!found[c].length) return;
    var id = 'g_' + c;
    html += '<div class="group"><div class="group-head" data-toggle="' + id + '">' +
            '<b>' + c + '</b><span>' + found[c].length + ' 项</span></div>' +
            '<div class="group-body" id="' + id + '">';
    found[c].forEach(function (u, i) {
      html += '<div class="item"><input type="checkbox" checked data-cat="' + c +
              '" data-url="' + escapeAttr(u) + '"><a href="' + escapeAttr(u) +
              '" target="_blank" rel="noopener noreferrer">' + escapeHtml(u) + '</a></div>';
    });
    html += '</div></div>';
  });

  box.innerHTML = html;
  document.getElementById('bar').style.display = 'flex';

  box.querySelectorAll('.group-head').forEach(function (h) {
    h.onclick = function () {
      var b = document.getElementById(h.dataset.toggle);
      b.style.display = b.style.display === 'none' ? 'block' : 'none';
    };
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function escapeAttr(s) { return escapeHtml(s); }

function setStatus(msg, cls) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

async function run() {
  var raw = document.getElementById('url').value.trim();
  if (!raw) { setStatus('先填网址', 'err'); return; }
  if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;

  var deep = document.getElementById('deep').checked;
  var withLinks = document.getElementById('withLinks').checked;

  clearFound();
  document.getElementById('result').innerHTML = '';
  document.getElementById('bar').style.display = 'none';
  document.getElementById('go').disabled = true;
  setStatus('正在抓取 ' + raw + ' …');

  try {
    var queue = [{ url: raw, d: 0 }];
    var seen = {};
    var ok = 0;
    var lastErr = '';

    while (queue.length && ok < 6) {
      var job = queue.shift();
      if (seen[job.url]) continue;
      seen[job.url] = 1;

      setStatus('正在抓取 ' + job.url + ' …（已成功 ' + ok + ' 页）');
      var html;
      try {
        html = await fetchText(job.url);
      } catch (e) {
        lastErr = e.message;
        continue;
      }
      ok++;

      var links = extract(html, job.url);

      if (deep && job.d < 1) {
        var picks = 0;
        for (var i = 0; i < links.length && picks < 5; i++) {
          if (sameOriginLink(links[i], raw) && !seen[links[i]]) {
            queue.push({ url: links[i], d: job.d + 1 });
            picks++;
          }
        }
      }
    }

    if (!ok) throw new Error(lastErr || '抓取失败');

    if (!withLinks) found['链接'] = [];
    render();

    var total = 0;
    CATS.forEach(function (c) { total += found[c].length; });
    setStatus('完成，共 ' + total + ' 项资源（抓了 ' + ok + ' 页）', 'ok');
  } catch (e) {
    setStatus('失败：' + e.message, 'err');
  } finally {
    document.getElementById('go').disabled = false;
  }
}

function selected() {
  var out = [];
  document.querySelectorAll('#result input[type=checkbox]').forEach(function (cb) {
    if (cb.checked) out.push({ cat: cb.dataset.cat, url: cb.dataset.url });
  });
  return out;
}

document.getElementById('go').onclick = run;

document.getElementById('copyAll').onclick = async function () {
  var list = selected();
  if (!list.length) { setStatus('没有选中项', 'err'); return; }
  var text = list.map(function (x) { return x.url; }).join('\n');
  try {
    await navigator.clipboard.writeText(text);
    setStatus('已复制 ' + list.length + ' 条链接', 'ok');
  } catch (e) {
    var t = document.createElement('textarea');
    t.value = text;
    document.body.appendChild(t);
    t.select();
    document.execCommand('copy');
    t.remove();
    setStatus('已复制 ' + list.length + ' 条链接', 'ok');
  }
};

document.getElementById('saveAll').onclick = function () {
  var list = selected();
  if (!list.length) { setStatus('没有选中项', 'err'); return; }
  var lines = [];
  CATS.forEach(function (c) {
    var part = list.filter(function (x) { return x.cat === c; });
    if (!part.length) return;
    lines.push('=== ' + c + '（' + part.length + '）===');
    part.forEach(function (x) { lines.push(x.url); });
    lines.push('');
  });
  var blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'm87-resources.txt';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
  setStatus('清单已下载', 'ok');
};
</script>
</body>
</html>
